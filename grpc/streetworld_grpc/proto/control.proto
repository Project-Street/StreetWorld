syntax = "proto3";

package streetworld.streetstudio;

import "common.proto";

// Step request
message StepRequest {
    repeated float action = 1;  // [steering, throttle] normalized to [-1, 1]
}

// Step response
message StepResponse {
    float reward = 1;
    bool terminated = 2;
    bool truncated = 3;
    repeated CameraImage images = 4;  // All camera images (latest frame only)
    ObservationInfo info = 5;
}
